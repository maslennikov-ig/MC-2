# MegaCampus Infrastructure Docker Compose
# Shared infrastructure services (run ONCE, shared by blue/green apps)
# Usage: docker compose -f docker-compose.infra.yml up -d

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================

  # Redis for BullMQ queues and caching
  redis:
    image: redis:7-alpine
    container_name: megacampus-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Docling MCP Server for document processing (internal - behind nginx proxy)
  # NOTE: Image built manually on server (too large for GitHub Actions)
  docling-mcp-internal:
    image: ghcr.io/maslennikov-ig/mc-2/docling-mcp:latest
    pull_policy: if_not_present # Don't pull if local image exists (too large: 8GB)
    container_name: megacampus-docling-mcp-internal
    restart: unless-stopped
    # No external ports - only accessible via nginx proxy
    volumes:
      - ./data/uploads:/app/uploads:ro
      - ./data/uploads-dev:/app/uploads-dev:ro
      - docling-models:/app/models
      - docling-cache:/app/cache
      # Shared JSON cache - worker reads from here
      - docling-json-cache:/usr/local/lib/python3.12/site-packages/_cache
    environment:
      - DOCLING_CACHE_DIR=/app/cache
      - DOCLING_MODELS_PATH=/app/models
      - DOCLING_LOG_LEVEL=INFO
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import socket; s=socket.socket(); s.connect((''localhost'', 8000)); s.close()" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # Nginx proxy for Docling MCP - rewrites Host header to bypass DNS rebinding protection
  docling-mcp:
    image: nginx:alpine
    container_name: megacampus-docling-mcp
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./nginx-docling-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      docling-mcp-internal:
        condition: service_healthy
    # No healthcheck needed - docling-mcp-internal has its own healthcheck
    # and nginx is just a transparent proxy
    networks:
      - megacampus
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # NotebookLM Bridge for Stage 7 NLM audio/video generation
  notebooklm-bridge:
    image: ghcr.io/maslennikov-ig/mc-2/notebooklm-bridge:latest
    container_name: megacampus-notebooklm-bridge
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NOTEBOOKLM_AUTH_JSON=${NOTEBOOKLM_AUTH_JSON:-}
      - NOTEBOOKLM_STORAGE_PATH=${NOTEBOOKLM_STORAGE_PATH:-}
      - NOTEBOOKLM_HOME=${NOTEBOOKLM_HOME:-/app/secrets/notebooklm}
      - NOTEBOOKLM_GENERATION_TIMEOUT_SECONDS=${NOTEBOOKLM_GENERATION_TIMEOUT_SECONDS:-3600}
      - NOTEBOOKLM_QUEUE_WAIT_TIMEOUT_SECONDS=${NOTEBOOKLM_QUEUE_WAIT_TIMEOUT_SECONDS:-3600}
      - NOTEBOOKLM_HTTP_TIMEOUT_SECONDS=${NOTEBOOKLM_HTTP_TIMEOUT_SECONDS:-60}
      - NOTEBOOKLM_POLL_ERROR_RETRY_LIMIT=${NOTEBOOKLM_POLL_ERROR_RETRY_LIMIT:-12}
      - NOTEBOOKLM_LOG_LEVEL=${NOTEBOOKLM_LOG_LEVEL:-INFO}
    volumes:
      - ${NOTEBOOKLM_STORAGE_STATE_DIR:-./secrets/notebooklm}:/app/secrets/notebooklm:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import socket; s=socket.socket(); s.connect((''localhost'', 8000)); s.close()" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # BullMQ Worker for background jobs (course generation stages 1-6)
  worker:
    image: ghcr.io/maslennikov-ig/mc-2/api:latest
    container_name: megacampus-worker
    restart: unless-stopped
    command: ['tsx', 'dist/orchestrator/worker-entrypoint.js']
    # Worker doesn't expose HTTP - disable healthcheck inherited from api image
    healthcheck:
      disable: true
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://megacampus-redis:6379
      - DOCLING_MCP_URL=http://docling-mcp:8000/mcp
      # Path to shared docling JSON cache
      - DOCLING_CACHE_PATH=/app/docling-cache
      # LKG config persistence
      - LKG_CONFIG_PATH=/app/data/lkg-config.json
    volumes:
      - ./data/uploads:/app/uploads
      # Shared JSON cache from docling-mcp
      - docling-json-cache:/app/docling-cache
      # LKG config persistence
      - worker-data:/app/data
    networks:
      - megacampus
    depends_on:
      redis:
        condition: service_healthy
      docling-mcp-internal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # Stage 7 Enrichment Worker (cover images, audio, video, quiz, presentation)
  worker-stage7:
    image: ghcr.io/maslennikov-ig/mc-2/api:latest
    container_name: megacampus-worker-stage7
    restart: unless-stopped
    command: ['tsx', 'dist/stages/stage7-enrichments/worker-entrypoint.js']
    healthcheck:
      disable: true
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://megacampus-redis:6379
      # Use local filesystem storage (Supabase bucket was removed 30.01.2026)
      - USE_LOCAL_STORAGE=true
      - ENRICHMENTS_LOCAL_PATH=/app/data/enrichments
      - ENRICHMENTS_PUBLIC_URL=/storage/enrichments
      - NOTEBOOKLM_BRIDGE_URL=http://megacampus-notebooklm-bridge:8000
      - NOTEBOOKLM_BRIDGE_TIMEOUT_MS=${NOTEBOOKLM_BRIDGE_TIMEOUT_MS:-3600000}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/enrichments:/app/data/enrichments
    networks:
      - megacampus
    depends_on:
      redis:
        condition: service_healthy
      notebooklm-bridge:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

networks:
  megacampus:
    driver: bridge
    name: megacampus-network

volumes:
  redis-data:
    driver: local
  docling-models:
    driver: local
  docling-cache:
    driver: local
  # Shared volume for docling JSON output - written by docling-mcp, read by worker
  docling-json-cache:
    driver: local
  # Worker data persistence for LKG config
  worker-data:
    driver: local
