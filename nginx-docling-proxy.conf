server {
    listen 8000;

    # Docker DNS resolver — re-resolve hostnames every 30s.
    # Without this, nginx caches IP at startup and 502s after container IP change.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Health check endpoint for Docker
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        # Use variable to force nginx to re-resolve DNS on each request.
        # Static proxy_pass resolves hostname once at startup → stale IP → 502.
        set $upstream http://docling-mcp-internal:8000;
        proxy_pass $upstream;

        # CRITICAL: Rewrite Host header to satisfy MCP SDK security check
        proxy_set_header Host 127.0.0.1:8000;

        # MCP Session headers - MUST be forwarded for stateful connections
        proxy_pass_request_headers on;
        proxy_set_header mcp-session-id $http_mcp_session_id;

        # SSE (Server-Sent Events) Support for MCP
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Standard headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-running document processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
