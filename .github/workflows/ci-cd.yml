# Unified CI/CD Pipeline - Optimized
# Combines CI and CD into single workflow with:
# - Shared cache between jobs (preserves symlinks unlike artifacts)
# - Parallel Docker builds via matrix strategy
# - Smart caching for dependencies and builds
# - ~50% faster than separate CI + CD workflows

name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - '.beads/**'
      - '.claude/**'
      - '.codex/**'
      - '.gemini/**'
      - 'docs/**'
      - 'specs/**'
      - 'output/**'
      - '.playwright-cli/**'
      - '**/*.md'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '.beads/**'
      - '.claude/**'
      - '.codex/**'
      - '.gemini/**'
      - 'docs/**'
      - 'specs/**'
      - 'output/**'
      - '.playwright-cli/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (faster deploy)'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: 'Force deploy even on non-master'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'
  DEPLOY_HOST: '95.81.98.230'
  DEPLOY_USER: 'claude-deploy'
  DEPLOY_PATH: '/opt/megacampus'

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  # ============================================
  # STAGE 1: Setup & Install (populates cache for other jobs)
  # ============================================
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ============================================
  # STAGE 1b: Change Detection (deployment/build gating)
  # ============================================
  changes:
    name: Detect Deploy-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
      should_build_docker: ${{ steps.detect.outputs.should_build_docker }}
      web_changed: ${{ steps.detect.outputs.web_changed }}
      api_changed: ${{ steps.detect.outputs.api_changed }}
      bridge_changed: ${{ steps.detect.outputs.bridge_changed }}
      deploy_config_changed: ${{ steps.detect.outputs.deploy_config_changed }}
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}
      docker_matrix: ${{ steps.detect.outputs.docker_matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect deploy-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/detect_deploy_changes.sh

  # ============================================
  # STAGE 2: Parallel Checks (lint, type-check, security, test)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (required for type-aware lint rules)
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build
          pnpm --filter @megacampus/shared-utils build

      - name: Run lint
        run: pnpm lint

      - name: Verify deploy contracts
        run: |
          node scripts/ci/check_color_env_contract.mjs
          node scripts/ci/test_color_env_contract.mjs
          node scripts/ci/test_ci_cd_workflow_gates.mjs
          bash scripts/ci/test_detect_deploy_changes.sh
          bash scripts/ci/test_blue_green_fail_closed.sh
          bash scripts/ci/test_host_operation_lock.sh
          bash scripts/ci/test_ephemeral_ghcr_auth.sh
          bash scripts/ci/test_docling_rollout.sh

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build
          pnpm --filter @megacampus/shared-utils build
          pnpm --filter @megacampus/course-gen-platform build

      - name: Run type check
        run: pnpm type-check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ============================================
  # Test Tier 1: Unit Tests (fast, always blocks merge)
  # ============================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 15
    # No Redis service - unit tests should use mocks, not real connections

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @megacampus/course-gen-platform exec playwright install --with-deps chromium

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build
          pnpm --filter @megacampus/shared-utils build

      - name: Build course-gen-platform (required for tests with global-setup)
        run: pnpm --filter @megacampus/course-gen-platform build

      - name: Run unit tests
        run: pnpm test:unit
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
          SUPABASE_ANON_KEY: test-anon-key
          OPENROUTER_API_KEY: test-openrouter-key
          JINA_API_KEY: test-jina-key
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: test-qdrant-key
          # No REDIS_URL - unit tests should mock Redis, not connect to real instance

  # ============================================
  # Test Tier 2: Contract Tests (non-blocking, after unit tests)
  # ============================================
  test-contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: always() && needs.ci-success.result == 'success' && !inputs.skip_tests && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    timeout-minutes: 15

    # mc2-2i78i: dev and staging share ONE Supabase project, and the contract fixtures create their
    # test users at FIXED uuids (…0012/0013/0014), then move their organization_id, then tear them
    # down. Two runs are two writers to the same three rows: on 2026-07-31 commit c5eeb1ced passed
    # on develop and failed on master six seconds apart, with the fixture reading two different
    # organization_ids for the same user inside one setup.
    #
    # The group name is deliberately constant — it names the shared database, not the branch, which
    # is what the runs are actually contending for. cancel-in-progress stays false: the second run
    # must wait, not be discarded, or a real regression goes unreported.
    concurrency:
      group: contract-tests-shared-supabase
      cancel-in-progress: false

    # NOT continue-on-error. It made every contract failure render as a passing check, so the suite
    # could not report the collision above, let alone a real regression.

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.2
        env:
          QDRANT__SERVICE__API_KEY: test-qdrant-key
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build
          pnpm --filter @megacampus/shared-utils build

      - name: Build course-gen-platform (required for contract tests)
        run: pnpm --filter @megacampus/course-gen-platform build

      - name: Run contract tests
        run: pnpm test:contract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: test-qdrant-key
          REDIS_URL: redis://localhost:6379

  # ============================================
  # Test Tier 3: Integration Tests (delivery-branch pushes and pull requests)
  # ============================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [setup]
    if: >-
      ${{ !inputs.skip_tests &&
          ((github.event_name == 'pull_request' &&
            (github.base_ref == 'develop' || github.base_ref == 'master')) ||
           (github.event_name == 'push' &&
            (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')) ||
           github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.2
        env:
          QDRANT__SERVICE__API_KEY: test-qdrant-key
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build
          pnpm --filter @megacampus/shared-utils build

      - name: Build course-gen-platform (required for integration imports)
        run: pnpm --filter @megacampus/course-gen-platform build

      - name: Wait for Qdrant
        run: |
          for attempt in {1..30}; do
            if curl -fsS -H 'api-key: test-qdrant-key' http://localhost:6333/readyz >/dev/null; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Qdrant did not become ready"
          curl -v -H 'api-key: test-qdrant-key' http://localhost:6333/readyz || true
          exit 1

      - name: Run CI integration smoke tests
        run: |
          set +e
          timeout 300 pnpm test:integration:ci
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 124 ]; then
            echo "::error::CI integration smoke tests timed out after 5 minutes"
            exit 1
          fi
          exit $EXIT_CODE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: test-qdrant-key
          REDIS_URL: redis://localhost:6379

  # ============================================
  # STAGE 3: Build All Packages
  # ============================================
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [type-check]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build
          pnpm --filter @megacampus/shared-utils build

      - name: Build course-gen-platform
        run: pnpm --filter @megacampus/course-gen-platform build

      - name: Analyze processor bundle size
        run: pnpm --filter @megacampus/course-gen-platform analyze:bundle

      - name: Build web
        run: pnpm --filter @megacampus/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret

  # ============================================
  # STAGE 4: CI Success Gate
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, build, test-unit, test-integration]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed!"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "Type check failed!"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          if [ "${{ needs.test-unit.result }}" != "success" ] && \
             [ "${{ needs.test-unit.result }}" != "skipped" ]; then
            echo "Unit tests failed with result: ${{ needs.test-unit.result }}"
            exit 1
          fi
          if [ "${{ needs.test-integration.result }}" != "success" ]; then
            if [ "${{ inputs.skip_tests == true }}" = "true" ] && \
               [ "${{ needs.test-integration.result }}" = "skipped" ]; then
              echo "Integration tests explicitly skipped by workflow input"
            else
              echo "Integration tests failed with result: ${{ needs.test-integration.result }}"
              exit 1
            fi
          fi
          echo "All critical CI checks passed!"

  # ============================================
  # STAGE 5: Parallel Docker Builds (master + develop)
  # ============================================
  build-docker:
    name: Build Docker - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [ci-success, changes]
    if: always() && needs.ci-success.result == 'success' && needs.changes.outputs.should_build_docker == 'true' && ((github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') || inputs.force_deploy)
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.docker_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NODE_VERSION=22
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_SUPABASE_URL={0}', secrets.SUPABASE_URL) || '' }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_SUPABASE_ANON_KEY={0}', secrets.SUPABASE_ANON_KEY) || '' }}
            ${{ matrix.image == 'web' && format('SUPABASE_SERVICE_ROLE_KEY={0}', secrets.SUPABASE_SERVICE_KEY) || '' }}
            ${{ matrix.image == 'web' && format('SUPABASE_JWT_SECRET={0}', secrets.SUPABASE_JWT_SECRET) || '' }}
            ${{ matrix.image == 'web' && 'NEXT_PUBLIC_COURSEGEN_BACKEND_URL=/api' || '' }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_FEATURE_USERBACK={0}', secrets.NEXT_PUBLIC_FEATURE_USERBACK) || '' }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_USERBACK_TOKEN={0}', secrets.NEXT_PUBLIC_USERBACK_TOKEN) || '' }}

  # ============================================
  # Migration drift gate (read-only)
  # Fails the deploy if repo Supabase migrations are not applied to the shared
  # database (dev + staging share one project). Skips (passes) until the repo
  # secret SUPABASE_DB_URL is configured, so it is safe to merge before that
  # secret is provisioned. See beads mc2-hnkmf.
  # ============================================
  migration-drift-check:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.outputs.should_deploy == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || inputs.force_deploy)
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migration drift gate not configured
        if: env.SUPABASE_DB_URL == ''
        run: echo "::warning::SUPABASE_DB_URL not set; migration drift gate skipped. Add the repo secret to enable (mc2-hnkmf)."
      - name: Check migration drift
        if: env.SUPABASE_DB_URL != ''
        run: pnpm -F course-gen-platform exec tsx scripts/check-migration-drift.ts

  # ============================================
  # STAGE 6: Deploy to Production
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: [changes, ci-success, build-docker, migration-drift-check]
    if: always() && needs.changes.outputs.should_deploy == 'true' && needs.ci-success.result == 'success' && (needs.build-docker.result == 'success' || (needs.build-docker.result == 'skipped' && needs.changes.outputs.should_build_docker != 'true')) && (needs.migration-drift-check.result == 'success' || needs.migration-drift-check.result == 'skipped') && (github.ref == 'refs/heads/master' || inputs.force_deploy)
    timeout-minutes: 10
    environment:
      name: production
      url: https://ai.megacampus.ru

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}/deploy ${{ env.DEPLOY_PATH }}/ops ${{ env.DEPLOY_PATH }}/scripts/lib"

          scp -i ~/.ssh/deploy_key \
            docker-compose.infra.yml \
            docker-compose.app.yml \
            docker-compose.production.yml \
            docker-compose.docling-rollback.yml \
            nginx-docling-proxy.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

          # Copy nginx template (single source of truth for Blue/Green)
          scp -i ~/.ssh/deploy_key \
            deploy/nginx/megacampus.conf.template \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/nginx.conf.template

          scp -i ~/.ssh/deploy_key \
            scripts/deploy_blue_green.sh \
            scripts/rollback_blue_green.sh \
            scripts/with_host_operation_lock.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/scripts/
          scp -i ~/.ssh/deploy_key \
            scripts/lib/docling-rollout.sh \
            scripts/lib/ghcr-auth.sh \
            scripts/lib/host-operation-lock.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/scripts/lib/

          # mc2-o0g75: deploy/qdrant/** is deployed read-only (0444, 0555) by the Q12 asset
          # convention, and scp overwrites a file in place rather than replacing it — so the
          # 2026-07-20 deploy died here and production had not been deployed since 2026-07-04.
          # tar --unlink-first replaces each file instead of writing through it, which needs only
          # the directory to be writable, and it is. The archive carries FILES only — `--unlink-first`
          # applied to a directory entry fails with "Cannot unlink: Directory not empty", so the
          # member list comes from find and the target directories are left alone.
          #
          # Two files are deliberately NOT copied: q12-privileged-launch.sh is the root-owned argv
          # whitelist launcher and q12-writer-resume.py is its root-owned payload. The deploy user
          # cannot rewrite them, and it must not — root ownership is the security property. They
          # change only through the deliberate manual install, never through an ordinary deploy.
          # deploy/postgres was missing here until 2026-07-31: the Supabase backup scripts the
          # ENABLED nightly timer executes had no delivery path at all, so a change to
          # scheduled-backup-run.sh sat in the repository while the host kept running the old copy.
          # Found by running the unit and watching the metric it was supposed to publish not appear.
          # The tree is claude-deploy-owned, so unlike ops/qdrant it can simply be shipped.
          find deploy/qdrant deploy/systemd deploy/postgres -type f \
            ! -name q12-privileged-launch.sh \
            ! -name q12-writer-resume.py \
            ! -path '*/__pycache__/*' \
            -print0 \
            | tar -cf - --null --no-recursion -T - \
            | ssh -i ~/.ssh/deploy_key \
              ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
              "tar -xf - --no-same-owner --unlink-first -C ${{ env.DEPLOY_PATH }}"

          # Put the read-only modes back, from the same tracked manifest the window pre-flight's H2
          # probe checks against, so an ordinary deploy does not leave the tree 0644 and turn H2
          # into a false alarm.
          scp -i ~/.ssh/deploy_key \
            scripts/ci/restore_deployed_asset_modes.py \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/restore_deployed_asset_modes.py
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "python3 /tmp/restore_deployed_asset_modes.py --deploy-root ${{ env.DEPLOY_PATH }} && rm -f /tmp/restore_deployed_asset_modes.py"

          # mc2-o0g75, second face: /opt/megacampus/ops/qdrant is root-owned all the way down
          # (Prometheus/Grafana/Alertmanager config, installed root-owned by deliberate hardening),
          # so this scp could never have succeeded as the deploy user either. It is monitoring
          # configuration, not application code — an ordinary app deploy has no business rewriting
          # it, and it changes through the same deliberate root install that put it there.
          #
          # mc2-ugl5g: this used to end with the claim "the deployed tree is byte-identical to the
          # repository", which nothing checked and which went false the moment 89b4cdd9d changed
          # alerts.yml. Stage the tree where the deploy user CAN write, so the root install has a
          # source, and measure the live tree in the gate below instead of asserting it.
          tar -cf - ops/qdrant \
            | ssh -i ~/.ssh/deploy_key \
              ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
              "rm -rf ${{ env.DEPLOY_PATH }}/ops-staged && mkdir -p ${{ env.DEPLOY_PATH }}/ops-staged && tar -xf - --no-same-owner -C ${{ env.DEPLOY_PATH }}/ops-staged --strip-components=1"

      - name: Create .env.production
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cat > ${{ env.DEPLOY_PATH }}/.env.production << 'ENVEOF'
          NODE_ENV=production
          PORT=4000
          LOG_LEVEL=info
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          REDIS_URL=redis://megacampus-redis:6379
          QDRANT_URL=http://qdrant:6333
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          QDRANT_API_KEY_FILE=/opt/megacampus/secrets/qdrant_api_key
          QDRANT_READ_ONLY_API_KEY_FILE=/opt/megacampus/secrets/qdrant_read_only_api_key
          QDRANT_SNAPSHOT_STORAGE_MODE=local
          SOURCE_RECOVERY_PRODUCTION_UPLOAD_ROOT=/opt/megacampus/data/uploads
          SOURCE_RECOVERY_DEVELOPMENT_UPLOAD_ROOT=/opt/megacampus/data/uploads-dev
          SOURCE_RECOVERY_STATE_HOST_DIR=/var/lib/megacampus-source-recovery/state
          SOURCE_RECOVERY_CAPABILITY_HOST_DIR=/opt/megacampus/data/source-recovery-capability
          SOURCE_RECOVERY_PROGRESS_HOST_DIR=/var/lib/megacampus-source-recovery/state/progress
          SOURCE_RECOVERY_PLAN_INPUT_FILE=/var/lib/megacampus-source-recovery/plan-input.json
          SOURCE_RECOVERY_MANIFEST_FILE=/var/lib/megacampus-source-recovery/state/manifest.json
          PROMETHEUS_QDRANT_READ_ONLY_API_KEY_FILE=/opt/megacampus/secrets/prometheus_qdrant_read_only_api_key
          GRAFANA_ADMIN_PASSWORD_FILE=/opt/megacampus/secrets/grafana_admin_password
          ALERTMANAGER_TELEGRAM_BOT_TOKEN_FILE=/opt/megacampus/secrets/alertmanager_telegram_bot_token
          ALERTMANAGER_TELEGRAM_CHAT_ID_FILE=/opt/megacampus/secrets/alertmanager_telegram_chat_id
          QDRANT_METRICS_TEXTFILE_HOST_DIR=/var/lib/megacampus/qdrant-metrics
          QDRANT_METRICS_GID=${{ secrets.QDRANT_METRICS_GID }}
          DOCUMENT_EVIDENCE_ENABLED=true
          DOCUMENT_EVIDENCE_MODE=active
          DOCUMENT_EVIDENCE_STAGE5_COHORT_PERCENT=100
          JINA_API_KEY=${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_SITE_URL=https://ai.megacampus.ru
          NEXT_PUBLIC_APP_URL=https://ai.megacampus.ru
          CORS_ORIGIN=https://ai.megacampus.ru
          DOCLING_MCP_URL=http://docling-mcp:8000/mcp
          DOCLING_MCP_TIMEOUT=1200000
          DOCLING_MCP_MAX_RETRIES=1
          DOCLING_STACK_V2_ENABLED=${{ vars.DOCLING_STACK_V2_ENABLED || 'false' }}
          DOCLING_MCP_IMAGE=${{ vars.DOCLING_MCP_IMAGE }}
          DOCLING_SERVE_IMAGE=${{ vars.DOCLING_SERVE_IMAGE }}
          DOCLING_ROLLBACK_IMAGE=${{ vars.DOCLING_ROLLBACK_IMAGE }}
          # The release currently running in production. The rollout gate needs
          # it to recognise the host on the SECOND and every later image change,
          # when what is running is neither the 1.x rollback nor the new
          # candidate. Move it to the old DOCLING_MCP_IMAGE whenever that changes.
          DOCLING_PREVIOUS_MCP_IMAGE=${{ vars.DOCLING_PREVIOUS_MCP_IMAGE }}
          # Chunking strategy is a REPOSITORY VARIABLE, not a code default, so the
          # rollback is one variable edit and a redeploy rather than a revert. The
          # fallback here stays `legacy_markdown`: an unset variable must never
          # silently change how documents are cut.
          DOCLING_CHUNK_STRATEGY=${{ vars.DOCLING_CHUNK_STRATEGY || 'legacy_markdown' }}
          NOTEBOOKLM_BRIDGE_TOKEN=${{ secrets.NOTEBOOKLM_BRIDGE_TOKEN }}
          NOTEBOOKLM_STORAGE_STATE_DIR=./secrets/notebooklm
          NOTEBOOKLM_STORAGE_PATH=/app/secrets/notebooklm/storage_state.json
          COURSEGEN_BACKEND_URL=http://api:4000
          NEXT_PUBLIC_COURSEGEN_BACKEND_URL=/api
          NEXT_PUBLIC_FEATURE_USERBACK=${{ secrets.NEXT_PUBLIC_FEATURE_USERBACK }}
          NEXT_PUBLIC_USERBACK_TOKEN=${{ secrets.NEXT_PUBLIC_USERBACK_TOKEN }}
          NEXT_TELEMETRY_DISABLED=1
          NODE_OPTIONS=--max-old-space-size=2048
          ENVEOF
          chmod 600 ${{ env.DEPLOY_PATH }}/.env.production"

      # mc2-c2p8z, the same drift class: QDRANT_METRICS_GID was written from a repository secret
      # that was never configured, so this step silently replaced a working value with an empty one
      # and docker compose refused with "required variable QDRANT_METRICS_GID is missing a value".
      # It is not a secret at all — it is the numeric id of the host's dedicated metrics group, so
      # it is read from the host that owns it and cannot drift from the group it names. Fails closed
      # if the group is absent, rather than writing an empty value over a good one again.
      # A typo here is invisible everywhere else. `resolveChunkingStrategy` warns
      # and falls back to `legacy_markdown` on an unrecognised value, so
      # `docling-hybrid` or `Docling_Hybrid` produces a GREEN deploy that
      # switched nothing, with one line in a worker log as the only trace.
      # Checked against the three values the code accepts, at the moment the
      # value is chosen rather than hours later when someone reads a log.
      - name: Validate the Docling chunking strategy
        env:
          DOCLING_CHUNK_STRATEGY: ${{ vars.DOCLING_CHUNK_STRATEGY || 'legacy_markdown' }}
        run: |
          case "$DOCLING_CHUNK_STRATEGY" in
            legacy_markdown|docling_hierarchical|docling_hybrid) ;;
            *)
              echo "::error::DOCLING_CHUNK_STRATEGY is '$DOCLING_CHUNK_STRATEGY'; expected legacy_markdown, docling_hierarchical or docling_hybrid. The application would silently fall back to legacy_markdown and the deploy would look green."
              exit 1
              ;;
          esac
          echo "Docling chunking strategy: $DOCLING_CHUNK_STRATEGY"

      - name: Resolve host-derived environment values
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            'set -eu
             gid="$(getent group megacampus-metrics | cut -d: -f3)"
             case "$gid" in ""|*[!0-9]*) echo "::error::host group megacampus-metrics is missing or not numeric"; exit 1 ;; esac
             file="${{ env.DEPLOY_PATH }}/.env.production"
             if grep -q "^QDRANT_METRICS_GID=" "$file"; then
               sed -i "s/^QDRANT_METRICS_GID=.*/QDRANT_METRICS_GID=$gid/" "$file"
             else
               printf "QDRANT_METRICS_GID=%s\n" "$gid" >> "$file"
             fi
             grep -q "^QDRANT_METRICS_GID=$gid$" "$file" || { echo "::error::failed to set QDRANT_METRICS_GID"; exit 1; }
             echo "QDRANT_METRICS_GID resolved from host group megacampus-metrics: $gid"'

      # The secrets directory is 0711, not 0700: traversable but not listable. 0700 root locks out
      # every non-root consumer that legitimately owns a file in there — on 2026-07-30 this step ran
      # for the first time since the deploy broke, and it took down both the NotebookLM directory
      # creation and the nightly Supabase backup, whose DSN is a claude-deploy-owned 0600 file the
      # service could no longer even stat. 0711 keeps the enumeration guard (you cannot list what
      # you cannot name) while each file's own mode stays the real access control: the Qdrant and
      # Telegram keys remain 0400 root/nobody and are still unreadable to the deploy user.
      - name: Create Qdrant secret files
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_READ_ONLY_API_KEY: ${{ secrets.QDRANT_READ_ONLY_API_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          umask 077
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          for spec in \
            QDRANT_API_KEY:qdrant_api_key \
            QDRANT_READ_ONLY_API_KEY:qdrant_read_only_api_key \
            GRAFANA_ADMIN_PASSWORD:grafana_admin_password \
            TELEGRAM_BOT_TOKEN:alertmanager_telegram_bot_token \
            TELEGRAM_CHAT_ID:alertmanager_telegram_chat_id; do
            name="${spec%%:*}"
            file_name="${spec#*:}"
            value="${!name:-}"
            test -n "$value" || { echo "::error::$name is required"; exit 1; }
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name must be a single line"; exit 1;; esac
            printf '%s' "$value" > "$secret_dir/$file_name"
          done
          cp "$secret_dir/qdrant_read_only_api_key" "$secret_dir/prometheus_qdrant_read_only_api_key"
          upload_dir="${{ env.DEPLOY_PATH }}/.qdrant-secrets-${{ github.run_id }}"
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "rm -rf '$upload_dir' && install -d -m 0700 '$upload_dir'"
          scp -i ~/.ssh/deploy_key "$secret_dir"/* \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:"$upload_dir"/
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "set -e; trap 'rm -rf \"$upload_dir\"' EXIT; sudo install -d -o 0 -g 0 -m 0711 '${{ env.DEPLOY_PATH }}/secrets'; sudo install -o 0 -g 0 -m 0400 '$upload_dir/qdrant_api_key' '$upload_dir/qdrant_read_only_api_key' '${{ env.DEPLOY_PATH }}/secrets/'; sudo install -o 65534 -g 65534 -m 0400 '$upload_dir/prometheus_qdrant_read_only_api_key' '$upload_dir/alertmanager_telegram_bot_token' '$upload_dir/alertmanager_telegram_chat_id' '${{ env.DEPLOY_PATH }}/secrets/'; sudo install -o 472 -g 472 -m 0400 '$upload_dir/grafana_admin_password' '${{ env.DEPLOY_PATH }}/secrets/grafana_admin_password'"

      - name: Cleanup Qdrant secret upload
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "rm -rf '${{ env.DEPLOY_PATH }}/.qdrant-secrets-${{ github.run_id }}'" || true

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && DEPLOY_WEB_CHANGED='${{ needs.changes.outputs.web_changed }}' DEPLOY_API_CHANGED='${{ needs.changes.outputs.api_changed }}' DEPLOY_BRIDGE_CHANGED='${{ needs.changes.outputs.bridge_changed }}' DEPLOY_CONFIG_CHANGED='${{ needs.changes.outputs.deploy_config_changed }}' GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' GITHUB_ACTOR='${{ github.actor }}' bash scripts/deploy_blue_green.sh production ${{ github.sha }}"

      - name: Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 15

          # Check Web via HTTPS with retry (Next.js cold start can take >30s)
          WEB_OK=false
          for i in $(seq 1 12); do
            if curl -f -s --max-time 10 https://ai.megacampus.ru/api/health > /dev/null 2>&1; then
              WEB_OK=true
              echo "Web service healthy (attempt $i)"
              break
            fi
            echo "Waiting for web... ($i/12)"
            sleep 10
          done

          if [ "$WEB_OK" != "true" ]; then
            echo "Web health check failed after 12 attempts!"
            exit 1
          fi

          # Get active color to determine API port
          ACTIVE_COLOR=$(ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cat ${{ env.DEPLOY_PATH }}/active_color")

          if [ "$ACTIVE_COLOR" = "blue" ]; then
            API_PORT=4001
          else
            API_PORT=4002
          fi

          echo "Active color: $ACTIVE_COLOR, API port: $API_PORT"

          if ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "curl -f -s http://localhost:$API_PORT/health" > /dev/null; then
            echo "API service healthy"
          else
            echo "API health check failed!"
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "sed -i 's/^status=switched$/status=accepted/' /opt/megacampus/deploy_state && grep -qx 'status=accepted' /opt/megacampus/deploy_state"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================
  # STAGE 7: Rollback on Failure
  # ============================================
  # ============================================
  # Monitoring config drift (reports; never rolls back)
  # ============================================
  monitoring-drift:
    name: Monitoring Config Drift
    runs-on: ubuntu-latest
    needs: [deploy]
    # A SEPARATE JOB on purpose. As a step inside `deploy` this failed the deploy JOB, and the
    # rollback job keys on exactly that -- so on 2026-08-01 a Prometheus rule file being one commit
    # behind rolled production back to the previous image, and the pipeline reported success.
    # Drift must be loud and must never move production.
    if: ${{ always() && needs.deploy.result == 'success' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Verify monitoring config is not drifted
        run: |
          python3 scripts/ci/check_monitoring_drift.py --emit-manifest > /tmp/monitoring-manifest.json

          scp -i ~/.ssh/deploy_key \
            scripts/ci/check_monitoring_drift.py /tmp/monitoring-manifest.json \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/

          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "python3 /tmp/check_monitoring_drift.py --check --manifest /tmp/monitoring-manifest.json; rc=\$?; rm -f /tmp/check_monitoring_drift.py /tmp/monitoring-manifest.json; exit \$rc"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy]
    # Roll back only after an actual production deploy job failure.
    # A broad failure() condition also fires on unrelated CI/setup failures when
    # deploy is skipped, which can trigger a misleading rollback attempt.
    if: ${{ failure() && needs.deploy.result == 'failure' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Execute rollback
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && if test -r deploy_state && grep -Eq '^status=(switched|accepted)$' deploy_state && grep -qx 'commit=${{ github.sha }}' deploy_state; then bash scripts/rollback_blue_green.sh production ${{ github.sha }}; else echo 'Rollback skipped: current deployment never switched traffic'; fi"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================
  # STAGE 7b: Deploy to Dev Environment
  # ============================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: [changes, ci-success, build-docker, migration-drift-check]
    if: always() && needs.changes.outputs.should_deploy == 'true' && needs.ci-success.result == 'success' && (needs.build-docker.result == 'success' || (needs.build-docker.result == 'skipped' && needs.changes.outputs.should_build_docker != 'true')) && (needs.migration-drift-check.result == 'success' || needs.migration-drift-check.result == 'skipped') && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    timeout-minutes: 20
    environment:
      name: development
      url: https://dev.ai.megacampus.ru

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}/scripts/lib"
          scp -i ~/.ssh/deploy_key \
            docker-compose.dev.yml \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

          # Copy nginx dev config (single source of truth)
          scp -i ~/.ssh/deploy_key \
            deploy/nginx/megacampus-dev.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/nginx-dev.conf

          scp -i ~/.ssh/deploy_key \
            scripts/deploy_dev.sh \
            scripts/with_host_operation_lock.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/scripts/
          scp -i ~/.ssh/deploy_key \
            scripts/lib/docling-rollout.sh \
            scripts/lib/ghcr-auth.sh \
            scripts/lib/host-operation-lock.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/scripts/lib/

      - name: Create .env.dev
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cat > ${{ env.DEPLOY_PATH }}/.env.dev << 'ENVEOF'
          NODE_ENV=production
          PORT=4000
          LOG_LEVEL=debug
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          REDIS_URL=redis://megacampus-redis:6379
          QDRANT_URL=http://megacampus-qdrant-dev:6333
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          JINA_API_KEY=${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_SITE_URL=https://dev.ai.megacampus.ru
          NEXT_PUBLIC_APP_URL=https://dev.ai.megacampus.ru
          CORS_ORIGIN=https://dev.ai.megacampus.ru,https://ai.megacampus.ru
          DOCLING_MCP_URL=http://megacampus-docling-mcp:8000/mcp
          DOCLING_MCP_TIMEOUT=1200000
          DOCLING_MCP_MAX_RETRIES=1
          NOTEBOOKLM_BRIDGE_TOKEN=${{ secrets.NOTEBOOKLM_BRIDGE_TOKEN }}
          NOTEBOOKLM_STORAGE_STATE_DIR=./secrets/notebooklm
          NOTEBOOKLM_STORAGE_PATH=/app/secrets/notebooklm/storage_state.json
          COURSEGEN_BACKEND_URL=http://megacampus-api-dev:4000
          NEXT_PUBLIC_COURSEGEN_BACKEND_URL=/api
          NEXT_PUBLIC_FEATURE_USERBACK=${{ secrets.NEXT_PUBLIC_FEATURE_USERBACK }}
          NEXT_PUBLIC_USERBACK_TOKEN=${{ secrets.NEXT_PUBLIC_USERBACK_TOKEN }}
          NEXT_TELEMETRY_DISABLED=1
          NODE_OPTIONS=--max-old-space-size=1024
          ENVEOF
          chmod 600 ${{ env.DEPLOY_PATH }}/.env.dev"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && DEPLOY_WEB_CHANGED='${{ needs.changes.outputs.web_changed }}' DEPLOY_API_CHANGED='${{ needs.changes.outputs.api_changed }}' DEPLOY_BRIDGE_CHANGED='${{ needs.changes.outputs.bridge_changed }}' DEPLOY_CONFIG_CHANGED='${{ needs.changes.outputs.deploy_config_changed }}' GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' GITHUB_ACTOR='${{ github.actor }}' bash scripts/deploy_dev.sh"

      - name: Verify deployment
        run: |
          echo "Waiting for services..."
          sleep 20

          # Check via SSH (DNS might not be ready yet)
          if ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "curl -f -s http://localhost:4010/health" > /dev/null; then
            echo "API service healthy"
          else
            echo "API health check failed!"
            exit 1
          fi

          if ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "curl -f -s -o /dev/null -w '%{http_code}' http://localhost:3010" | grep -q "200"; then
            echo "Web service healthy"
          else
            echo "Web health check failed!"
            exit 1
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================
  # STAGE 8: Notifications
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [changes, deploy, deploy-dev]
    if: always() && needs.changes.outputs.should_deploy == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_PROD_RESULT: ${{ needs.deploy.result }}
          DEPLOY_DEV_RESULT: ${{ needs.deploy-dev.result }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Determine which deploy ran and its result
          if [ "$BRANCH" == "master" ]; then
            DEPLOY_RESULT="$DEPLOY_PROD_RESULT"
            ENV_NAME="Staging"
            ENV_URL="https://ai.megacampus.ru"
          else
            DEPLOY_RESULT="$DEPLOY_DEV_RESULT"
            ENV_NAME="Dev"
            ENV_URL="https://dev.ai.megacampus.ru"
          fi

          if [ "$DEPLOY_RESULT" == "success" ]; then
            MESSAGE="🚀 *MegaCampus $ENV_NAME*%0A%0A✅ SUCCESS%0A%0A📦 Commit: \`${COMMIT_SHA:0:7}\`%0A🌿 Branch: $BRANCH%0A👤 Author: $ACTOR%0A🔗 [View]($RUN_URL)%0A%0A🌐 $ENV_URL"
          elif [ "$DEPLOY_RESULT" == "cancelled" ]; then
            MESSAGE="🚀 *MegaCampus $ENV_NAME*%0A%0A⏹ CANCELLED%0A%0A📦 Commit: \`${COMMIT_SHA:0:7}\`%0A🌿 Branch: $BRANCH%0A👤 Author: $ACTOR%0A🔗 [Logs]($RUN_URL)"
          elif [ "$DEPLOY_RESULT" == "skipped" ]; then
            MESSAGE="🚀 *MegaCampus $ENV_NAME*%0A%0A⏭ SKIPPED%0A%0A📦 Commit: \`${COMMIT_SHA:0:7}\`%0A🌿 Branch: $BRANCH%0A👤 Author: $ACTOR%0A🔗 [Logs]($RUN_URL)"
          else
            MESSAGE="🚀 *MegaCampus $ENV_NAME*%0A%0A❌ FAILED%0A%0A📦 Commit: \`${COMMIT_SHA:0:7}\`%0A🌿 Branch: $BRANCH%0A👤 Author: $ACTOR%0A🔗 [Logs]($RUN_URL)"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MESSAGE}"
