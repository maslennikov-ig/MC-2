# Unified CI/CD Pipeline - Optimized
# Combines CI and CD into single workflow with:
# - Shared artifacts between jobs (no duplicate pnpm installs)
# - Parallel Docker builds via matrix strategy
# - Smart caching for dependencies and builds
# - ~50% faster than separate CI + CD workflows

name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (faster deploy)'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: 'Force deploy even on non-master'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'
  DEPLOY_HOST: '95.81.98.230'
  DEPLOY_USER: 'claude-deploy'
  DEPLOY_PATH: '/opt/megacampus'

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  # ============================================
  # STAGE 1: Setup & Install (runs once, shared via artifacts)
  # ============================================
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore cached dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Save dependencies cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      # Upload workspace for subsequent jobs (faster than re-installing)
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-deps
          path: |
            node_modules
            packages/*/node_modules
          retention-days: 1
          compression-level: 1

  # ============================================
  # STAGE 2: Parallel Checks (lint, type-check, security, test)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-deps
          path: .

      - name: Run lint
        run: pnpm lint
        continue-on-error: true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-deps
          path: .

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/shared-types/dist
            packages/shared-logger/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/shared-types/src/**', 'packages/shared-logger/src/**') }}

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build

      - name: Run type check
        run: pnpm type-check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-deps
          path: .

      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-deps
          path: .

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build

      - name: Run tests
        run: pnpm test
        continue-on-error: true

  # ============================================
  # STAGE 3: Build All Packages
  # ============================================
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [type-check]
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-deps
          path: .

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/shared-types/dist
            packages/shared-logger/dist
            packages/course-gen-platform/dist
            packages/trpc-client-sdk/dist
            packages/web/.next/cache
          key: ${{ runner.os }}-build-full-${{ hashFiles('packages/**/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-full-

      - name: Build shared packages
        run: |
          pnpm --filter @megacampus/shared-types build
          pnpm --filter @megacampus/shared-logger build

      - name: Build course-gen-platform
        run: pnpm --filter @megacampus/course-gen-platform build

      - name: Build web
        run: pnpm --filter @megacampus/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret

      - name: Save build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages/shared-types/dist
            packages/shared-logger/dist
            packages/course-gen-platform/dist
            packages/trpc-client-sdk/dist
            packages/web/.next/cache
          key: ${{ runner.os }}-build-full-${{ hashFiles('packages/**/src/**') }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            packages/web/.next
          retention-days: 1
          compression-level: 1

  # ============================================
  # STAGE 4: CI Success Gate
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, build]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "Type check failed!"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          echo "All critical CI checks passed!"

  # ============================================
  # STAGE 5: Parallel Docker Builds (master only)
  # ============================================
  build-docker:
    name: Build Docker - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.ref == 'refs/heads/master' || inputs.force_deploy
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: ./packages/web/Dockerfile
            context: .
          - image: api
            dockerfile: ./packages/course-gen-platform/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NODE_VERSION=20
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_SUPABASE_URL={0}', secrets.SUPABASE_URL) || '' }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_SUPABASE_ANON_KEY={0}', secrets.SUPABASE_ANON_KEY) || '' }}
            ${{ matrix.image == 'web' && format('SUPABASE_SERVICE_ROLE_KEY={0}', secrets.SUPABASE_SERVICE_KEY) || '' }}
            ${{ matrix.image == 'web' && format('SUPABASE_JWT_SECRET={0}', secrets.SUPABASE_JWT_SECRET) || '' }}

  # ============================================
  # STAGE 6: Deploy to Production
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/master' || inputs.force_deploy
    timeout-minutes: 10
    environment:
      name: production
      url: https://ai.megacampus.ru

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.production.yml \
            nginx-docling-proxy.conf \
            nginx-megacampus.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

          scp -i ~/.ssh/deploy_key \
            scripts/deploy.sh \
            scripts/rollback.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/scripts/

      - name: Update nginx config
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "sudo cp ${{ env.DEPLOY_PATH }}/nginx-megacampus.conf /etc/nginx/sites-enabled/megacampus && sudo nginx -t && sudo systemctl reload nginx"

      - name: Create .env.production
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cat > ${{ env.DEPLOY_PATH }}/.env.production << 'ENVEOF'
          NODE_ENV=production
          PORT=4000
          LOG_LEVEL=info
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          REDIS_URL=redis://redis:6379
          QDRANT_URL=${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          JINA_API_KEY=${{ secrets.JINA_API_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_SITE_URL=https://ai.megacampus.ru
          NEXT_PUBLIC_APP_URL=https://ai.megacampus.ru
          CORS_ORIGIN=https://ai.megacampus.ru,https://megacampus.ai
          DOCLING_MCP_URL=http://docling-mcp:8000/mcp
          COURSEGEN_BACKEND_URL=http://api:4000
          NEXT_TELEMETRY_DISABLED=1
          NODE_OPTIONS=--max-old-space-size=2048
          ENVEOF
          chmod 600 ${{ env.DEPLOY_PATH }}/.env.production"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' GITHUB_ACTOR='${{ github.actor }}' bash scripts/deploy.sh production latest"

      - name: Verify deployment
        run: |
          echo "Waiting for services..."
          sleep 30

          if curl -f -s https://ai.megacampus.ru/api/health > /dev/null; then
            echo "Web service healthy"
          else
            echo "Web health check failed!"
            exit 1
          fi

          if ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "curl -f -s http://localhost:4000/health" > /dev/null; then
            echo "API service healthy"
          else
            echo "API health check failed!"
            exit 1
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================
  # STAGE 7: Rollback on Failure
  # ============================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Execute rollback
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && bash scripts/rollback.sh"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================
  # STAGE 8: Notifications
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && (github.ref == 'refs/heads/master' || inputs.force_deploy)

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_RESULT" == "success" ]; then
            MESSAGE="🚀 *MegaCampus Deploy*%0A%0A✅ SUCCESS%0A%0A📦 Commit: \`${COMMIT_SHA:0:7}\`%0A👤 Author: $ACTOR%0A🔗 [View]($RUN_URL)%0A%0A🌐 https://ai.megacampus.ru"
          else
            MESSAGE="🚀 *MegaCampus Deploy*%0A%0A❌ FAILED%0A%0A📦 Commit: \`${COMMIT_SHA:0:7}\`%0A👤 Author: $ACTOR%0A🔗 [Logs]($RUN_URL)"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MESSAGE}"
