name: Install Alertmanager Telegram secrets (one-off)

# One-off manual workflow: installs the two Alertmanager Telegram secret files
# onto the server, reusing the SAME GitHub secrets the deploy pipeline uses
# (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID) so alerts share the existing bot.
# Mirrors the "Create Qdrant secret files" step of ci-cd.yml verbatim for the
# telegram pair. Delete this file after the run (tracked in mc2-jz6y0.13).

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: '95.81.98.230'
  DEPLOY_USER: 'claude-deploy'
  DEPLOY_PATH: '/opt/megacampus'

jobs:
  install-telegram-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://ai.megacampus.ru
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Install Alertmanager Telegram secret files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          umask 077
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          for spec in \
            TELEGRAM_BOT_TOKEN:alertmanager_telegram_bot_token \
            TELEGRAM_CHAT_ID:alertmanager_telegram_chat_id; do
            name="${spec%%:*}"
            file_name="${spec#*:}"
            value="${!name:-}"
            test -n "$value" || { echo "::error::$name is required"; exit 1; }
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name must be a single line"; exit 1;; esac
            printf '%s' "$value" > "$secret_dir/$file_name"
          done
          upload_dir="${{ env.DEPLOY_PATH }}/.alert-secrets-${{ github.run_id }}"
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "rm -rf '$upload_dir' && install -d -m 0700 '$upload_dir'"
          scp -i ~/.ssh/deploy_key "$secret_dir"/* \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:"$upload_dir"/
          ssh -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "set -e; trap 'rm -rf \"$upload_dir\"' EXIT; sudo install -o 65534 -g 65534 -m 0400 '$upload_dir/alertmanager_telegram_bot_token' '$upload_dir/alertmanager_telegram_chat_id' '${{ env.DEPLOY_PATH }}/secrets/'"
