# Nightly model catalogue price sync (mc2-ts9i2).
#
# `scripts/check-model-catalog-drift.ts` existed since 2026-08-21 and ran
# nowhere: not in CI, not as an npm script. The one manual `--all` on the day it
# was written found five disagreeing entries, one of them on a live route.
#
# Deliberately NOT part of the blocking pipeline, and deliberately its own
# workflow so it cannot gate a deploy: a price is a fact about somebody else's
# service, and a provider changing a tariff overnight must not fail our build.
#
# **It writes the new rates rather than reporting them (2026-08-27).** For two
# months this opened a GitHub issue instead, which asked a person to retype two
# numbers the job already had. That was a ritual, not a control: `max_price` is
# resolved from the *live* rate at call time and only falls back to the
# catalogue when that lookup fails, and what a course is billed comes from
# `GET /api/v1/generation` seconds after the call. Nobody was ever going to
# decide anything from the ticket, so the ticket trained people to close it.
#
# What is worth interrupting somebody for is a LARGE move, and the size is not a
# taste: `PROVIDER_PRICE_CEILING_MULTIPLIER` is 1.5, so a rise of that factor is
# where a stale entry stops being untidy and starts refusing every call to the
# model. Those go to the same Telegram channel Alertmanager already uses. The
# rest are committed silently.

name: Model Catalogue Price Sync

on:
  schedule:
    # 03:20 UTC daily. Nothing else runs then, and OpenRouter tariff changes
    # land during the US day.
    - cron: '20 3 * * *'
  workflow_dispatch:

concurrency:
  group: model-catalog-drift
  cancel-in-progress: false

permissions:
  # To push the updated rates. It was `issues: write`; it is the same job doing
  # the same work, one step further along.
  contents: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'

jobs:
  drift:
    name: Apply the published rates to MODEL_CATALOG
    runs-on: ubuntu-latest
    # The unit suite alone takes ~5 minutes on this runner, plus install, three
    # workspace builds and a Chromium download. At 10 the 2026-09-04 run was
    # cancelled mid-suite and, because a cancelled job is not a failed one,
    # said nothing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the published rates across the whole catalogue
        id: drift
        continue-on-error: true
        run: |
          set +e
          pnpm -F course-gen-platform exec tsx scripts/check-model-catalog-drift.ts \
            --all --write 2>&1 | tee drift.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # 0 done, 2 we could not reach the API. Those must not look alike,
          # which is why the script separates them.
          exit 0

      - name: Report the API being unreachable, and stop
        if: steps.drift.outputs.status == '2'
        run: echo "::notice::OpenRouter was unreachable; the catalogue was not checked."

      # The snapshot beside the catalogue is rewritten too, so this proves the
      # pair still agree before anything is pushed. A sync that leaves the tree
      # red is worse than one that never ran.
      #
      # The placeholders are the same ones `pnpm test:unit` runs under in the
      # main pipeline, and they are not optional: `tests/setup-unit.ts` throws
      # on a missing `SUPABASE_URL` before a single test is collected. Without
      # them this step failed on 2026-08-28 — the only night the write mode ever
      # ran — and the commit below is gated on this step, so the job had applied
      # the new rates, thrown them away with the runner, and reported failure.
      # Two months of nightly syncs delivered nothing (mc2-rhyac).
      # The whole unit suite includes `career-playbook-pdf.test.ts`, which
      # renders through Playwright's Chromium. The main pipeline installs it
      # (`ci-cd.yml`); this job did not, and on 2026-09-05 — the first night
      # after the step started running the whole suite — four tests died on
      # `browserType.launch: Executable doesn't exist` and the rates were thrown
      # away with the runner again.
      - name: Install Playwright Chromium
        if: steps.drift.outputs.status == '0'
        run: pnpm --filter @megacampus/course-gen-platform exec playwright install --with-deps chromium

      - name: Prove the catalogue and its snapshot still agree
        if: steps.drift.outputs.status == '0'
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
          SUPABASE_ANON_KEY: test-anon-key
          OPENROUTER_API_KEY: test-openrouter-key
        run: |
          # All three, not just the catalogue's own package: both test files
          # reach `shared/logger`, which imports `@megacampus/shared-logger` from
          # its build output. A workspace package with no `dist` fails to resolve
          # before a test is collected, and it never showed locally because the
          # `dist` is already there.
          pnpm -F shared-types build
          pnpm -F shared-logger build
          pnpm -F shared-utils build
          # The whole unit suite, not a named pair.
          #
          # It used to run `model-catalog-coverage` and `cost-calculator` only,
          # and on 2026-09-03 that let the very thing this step exists to stop
          # through: the sync moved `z-ai/glm-5.2` from 1.19/3.74 to 0.966/3.036,
          # both named files agreed, and three other tests that had retyped the
          # old rate went red on `develop` after the commit landed. A list of
          # price-sensitive files is itself a thing that goes stale; the suite is
          # not. Those three now read the rate from the catalogue instead of
          # pinning it, so this is the second line of defence rather than the
          # first — but the first one is a convention, and conventions are what
          # this job keeps catching.
          #
          # It costs about seven minutes on a job that runs once a night and
          # whose entire purpose is to not leave the tree red.
          pnpm -F course-gen-platform test:unit

      - name: Commit the new rates
        if: steps.drift.outputs.status == '0'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "catalogue already matched the published rates"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add packages/shared-types/src/model-catalog.ts \
                  packages/course-gen-platform/tests/unit/model-catalog-coverage.test.ts
          git commit -m "chore(cost): sync MODEL_CATALOG with the published OpenRouter rates

          $(sed -n 's/^  \(.*→.*\)$/- \1/p' drift.log)

          Applied by the nightly price sync. The catalogue is the frozen fallback
          for provider.max_price; the live rate is preferred at call time and the
          receipt settles the real cost."
          git push origin HEAD:develop

      - name: Say so in Telegram when a price moved far enough to matter
        if: steps.drift.outputs.status == '0' && hashFiles('packages/course-gen-platform/drift-loud.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          moves=$(cat packages/course-gen-platform/drift-loud.txt)
          text=$(printf '%s\n' \
            '*Цены моделей сильно сдвинулись*' \
            '' \
            'Ночная сверка с OpenRouter. Новые цены уже записаны в каталог и запушены в `develop` — делать ничего не нужно. Это к сведению.' \
            '' \
            'Порог — 1.5x, столько же, во сколько раз потолок `max_price` строится от цены. За ним замороженная цена начинает отбивать вызовы.' \
            '' \
            '```' "$moves" '```' \
            '' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$text" \
                  '{chat_id:$c, text:$t, parse_mode:"Markdown"}')" >/dev/null

      # A sync that stops before its commit step delivers nothing, and until
      # 2026-08-29 it said so only in a run list nobody reads: the write mode
      # ran once, failed on a missing test variable, and the catalogue kept the
      # rates it had. The point of a job that fixes something by itself is that
      # nobody watches it, so its silence has to be the loud thing.
      # `failure()` is false for a job GitHub cancelled on `timeout-minutes`,
      # which is how the 2026-09-04 run delivered nothing and said nothing.
      - name: Say so in Telegram when the sync itself failed
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          text=$(printf '%s\n' \
            '*Ночная сверка цен не доехала*' \
            '' \
            'Задание упало или было отменено по таймауту до того, как записать новые цены в `develop`. Каталог остался с прежними значениями — это не авария, но чем дольше так, тем выше шанс, что замороженный потолок `max_price` начнёт отбивать вызовы.' \
            '' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$text" \
                  '{chat_id:$c, text:$t, parse_mode:"Markdown"}')" >/dev/null
