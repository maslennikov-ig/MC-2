name: Build immutable Docling images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docling-serve
            dockerfile: packages/course-gen-platform/docker/docling-serve/Dockerfile
            context: packages/course-gen-platform/docker/docling-serve
            version: 1.29.0-docling-2.118.0
          - image: docling-mcp
            dockerfile: packages/course-gen-platform/docker/docling-mcp/Dockerfile
            context: packages/course-gen-platform/docker/docling-mcp
            version: 3.0.0-docling-2.118.0
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ matrix.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable deployment reference
        run: |
          printf '%s\n' \
            'ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}' \
            > '${{ matrix.image }}-digest.txt'
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.image }}-digest
          path: ${{ matrix.image }}-digest.txt
          if-no-files-found: error
