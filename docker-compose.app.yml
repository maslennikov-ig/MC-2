# MegaCampus Application Docker Compose
# Blue/Green switchable application services
# Usage: COLOR=blue WEB_PORT=3001 API_PORT=4001 docker compose -f docker-compose.app.yml up -d

services:
  # ============================================
  # APPLICATION SERVICES (Blue/Green)
  # ============================================

  # Next.js Web Application
  web:
    image: ghcr.io/maslennikov-ig/mc-2/web:latest
    container_name: megacampus-web-${COLOR:-blue}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://megacampus.ai}
      - NEXT_PUBLIC_API_URL=http://megacampus-api-${COLOR:-blue}:4000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # API Server (Express + tRPC)
  api:
    image: ghcr.io/maslennikov-ig/mc-2/api:latest
    container_name: megacampus-api-${COLOR:-blue}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://megacampus-redis:6379
      - DOCLING_MCP_URL=http://megacampus-docling-mcp:8000/sse
    volumes:
      - ./data/uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

networks:
  megacampus:
    external: true
    name: megacampus-network
