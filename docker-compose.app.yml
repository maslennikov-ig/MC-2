# MegaCampus Application Docker Compose
# Blue/Green switchable application services
# Usage: COLOR=blue WEB_PORT=3001 API_PORT=4001 docker compose -f docker-compose.app.yml up -d

services:
  # ============================================
  # APPLICATION SERVICES (Blue/Green)
  # ============================================

  # Next.js Web Application
  web:
    image: ghcr.io/maslennikov-ig/mc-2/web:latest
    container_name: megacampus-web-${COLOR:-blue}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://ai.megacampus.ru}
      - NEXT_PUBLIC_API_URL=http://megacampus-api-${COLOR:-blue}:4000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # API Server (Express + tRPC)
  api:
    image: ghcr.io/maslennikov-ig/mc-2/api:latest
    container_name: megacampus-api-${COLOR:-blue}
    restart: unless-stopped
    user: '1001:1001'
    group_add:
      - '${QDRANT_METRICS_GID:?QDRANT_METRICS_GID must be a numeric dedicated group ID}'
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://megacampus-redis:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_METRICS_TEXTFILE_DIR=/var/lib/megacampus/qdrant-metrics
      - QDRANT_METRICS_SERVICE=api
      - QDRANT_METRICS_INSTANCE=api-${COLOR:-blue}
      - DOCLING_MCP_URL=http://megacampus-docling-mcp:8000/mcp
      - NOTEBOOKLM_BRIDGE_URL=http://megacampus-notebooklm-bridge:8000
      - NOTEBOOKLM_BRIDGE_TIMEOUT_MS=${NOTEBOOKLM_BRIDGE_TIMEOUT_MS:-3600000}
      # Local storage for enrichment playback URLs (must match worker-stage7)
      - USE_LOCAL_STORAGE=true
      - ENRICHMENTS_PUBLIC_URL=/storage/enrichments
      - ENRICHMENTS_PUBLIC_BASE_URL=${NEXT_PUBLIC_SITE_URL:-https://ai.megacampus.ru}
    volumes:
      - ./data/uploads:/app/uploads
      - ${QDRANT_METRICS_TEXTFILE_HOST_DIR:?QDRANT_METRICS_TEXTFILE_HOST_DIR must be set}:/var/lib/megacampus/qdrant-metrics
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

networks:
  megacampus:
    external: true
    name: megacampus-network
