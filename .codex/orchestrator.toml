schema_version = 2
role = "technical-orchestrator"
beads_dir = ".beads"
handoff_file = ".codex/handoff.md"
stage_summary_path_template = ".codex/stages/{stage_id}/summary.md"
artifact_template = ".codex/stage-artifact-template.md"
artifact_path_template = ".codex/stages/{stage_id}/artifacts/{task_id}.md"

[workspace]
multi_repo = false
launch_mode = "manual_user_launch"

[baseline]
profile = "balanced-v2.1"
source_skill = "orchestration-bootstrap"

[execution]
default_mode = "hybrid"
simple_task_max_files = 2
simple_task_max_minutes = 15

[autonomy]
default_mode = "act_on_reversible_local_changes"
act_without_asking = [
  "read_repo_files",
  "edit_tracked_repo_files",
  "update_repo_local_orchestration_contracts",
  "run_local_verification",
  "update_beads_when_task_truth_is_clear",
]
ask_before = [
  "destructive_or_irreversible_actions",
  "high_impact_externally_visible_actions_not_explicitly_required",
  "deploy_or_prod_staging_mutation",
  "permission_scope_expansion",
  "force_push_or_history_rewrite",
  "material_requirement_ambiguity",
]

[handoff]
mode = "current_state_plus_stages"
current_state_max_lines = 45
legacy_archive_dir = ".codex/agent-reports"

[artifacts]
tracked_in_git = true
format = "frontmatter_plus_short_note"
sensitivity = "internal_no_secrets"

[docs]
required_read_paths = [
  "AGENTS.md",
  "README.md",
  ".codex/handoff.md",
  ".claude/commands/push-dev.md",
  ".claude/commands/push.md",
  ".claude/commands/deploy.md",
  ".claude/docs/deployment-guide.md",
]
optional_read_paths = [
  ".codex/config.toml",
  "CLAUDE.md",
]
stage_close_update_paths = [
  ".codex/handoff.md",
  ".codex/stages",
]
runtime_contract_update_paths = [
  "AGENTS.md",
  "README.md",
  ".claude/commands/push-dev.md",
  ".claude/commands/push.md",
  ".claude/commands/deploy.md",
  ".claude/docs/deployment-guide.md",
  ".codex/handoff.md",
  ".codex/stages",
]
notes = [
  "Keep AGENTS.md short and stable; keep delivery commands and tracked stage state here instead of in large duplicated prompt files.",
  "Do not append stage chronology into .codex/handoff.md; move material stage history into .codex/stages/.",
]

[delivery]
dev_branch = "develop"
staging_branch = "master"
dev_delivery_command = "/push-dev"
release_command = "/push"
staging_deploy_command = "/deploy"
direct_push_to_protected_branches_forbidden = true

[delegation]
launcher = "user"
require_base_branch_and_commit = true
require_dedicated_worktree = true
require_strict_write_zone = true
require_clean_git_status = true
require_artifact = true
artifact_fields = [
  "task_id",
  "stage_id",
  "branch",
  "base_branch",
  "base_commit",
  "worktree",
  "status",
  "verification",
  "changed_files",
]

[review]
require_findings_first = true
allowed_decisions = ["merge", "fix", "split", "defer"]

[enforcement]
process_verification_entrypoint = "scripts/orchestration/run_process_verification.sh"
artifact_validator = "scripts/orchestration/validate_artifact.py"
stage_closure_check = "scripts/orchestration/check_stage_ready.py"
artifact_required_for_stage_close = true
handoff_must_reference_stage_on_close = true

[verification]
process_only_commands = [
  "scripts/orchestration/run_process_verification.sh",
]
code_change_commands = [
  "pnpm type-check",
  "pnpm build",
]
stage_level_optional_commands = [
  "pnpm test",
]

[session_completion]
required_steps = [
  "Run relevant verification commands for the touched scope.",
  "Update Beads statuses for completed and follow-up work.",
  "git pull --rebase",
  "git push",
  "Update .codex/handoff.md if stage truth changed.",
]

[exceptions]
shared_types_import_policy = "@megacampus/shared-types only"
manual_launch_is_default = true
