rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="qdrant",environment="staging"}'
        values: '0x20'
      - series: 'qdrant_app_status_recovery_mode{environment="staging"}'
        values: '1x20'
      - series: 'qdrant_rest_responses_total{status="200"}'
        values: '0+100x20'
      - series: 'qdrant_rest_responses_total{status="500"}'
        values: '0+3x20'
      - series: 'qdrant_rest_responses_duration_seconds_bucket{collection="course_embeddings_v1",le="0.1"}'
        values: '0+50x20'
      - series: 'qdrant_rest_responses_duration_seconds_bucket{collection="course_embeddings_v1",le="0.5"}'
        values: '0+90x20'
      - series: 'qdrant_rest_responses_duration_seconds_bucket{collection="course_embeddings_v1",le="1"}'
        values: '0+100x20'
      - series: 'qdrant_rest_responses_duration_seconds_bucket{collection="course_embeddings_v1",le="+Inf"}'
        values: '0+100x20'
      - series: 'qdrant_memory_resident_bytes{environment="staging"}'
        values: '1900000000x20'
      - series: 'qdrant_collection_points{id="course_embeddings_v1"}'
        values: '100x6 0x14'
      - series: 'megacampus_qdrant_hybrid_requests_total{service="worker",instance="worker"}'
        values: '0+100x20'
      - series: 'megacampus_qdrant_hybrid_fallback_total{service="worker",instance="worker"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: QdrantDown
        exp_alerts:
          - exp_labels:
              environment: staging
              job: qdrant
              severity: critical
            exp_annotations:
              summary: Qdrant metrics target is unavailable
              description: The authenticated Qdrant main-listener scrape has failed for two minutes.
      - eval_time: 6m
        alertname: QdrantRecoveryMode
        exp_alerts:
          - exp_labels:
              environment: staging
              severity: critical
            exp_annotations:
              summary: Qdrant remains in recovery mode
              description: Qdrant has reported recovery mode for five minutes.
      - eval_time: 7m
        alertname: QdrantPointCountUnexpectedDrop
        exp_alerts:
          - exp_labels:
              id: course_embeddings_v1
              severity: critical
            exp_annotations:
              summary: Qdrant collection point count dropped unexpectedly
              description: A physical collection lost more than ten percent of its points between scrapes.
      - eval_time: 16m
        alertname: QdrantMemoryHigh
        exp_alerts:
          - exp_labels:
              environment: staging
              severity: warning
            exp_annotations:
              summary: Qdrant resident memory is high
              description: Resident memory exceeds 85 percent of the fixed two GiB Compose limit.
      - eval_time: 16m
        alertname: QdrantHybridFallbackHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Qdrant hybrid fallback ratio is high
              description: Dense-only fallbacks exceed five percent of hybrid requests.
      - eval_time: 20m
        alertname: QdrantRestErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Qdrant REST error ratio is high
              description: Qdrant 4xx/5xx responses exceed two percent of REST responses.
    promql_expr_test:
      - expr: 'megacampus:qdrant_rest_error_ratio:10m'
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="megacampus:qdrant_rest_error_ratio:10m"}'
            value: 0.02912621359223301
      - expr: 'megacampus:qdrant_rest_latency_p95_seconds:5m'
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="megacampus:qdrant_rest_latency_p95_seconds:5m",collection="course_embeddings_v1"}'
            value: 0.7499999999999997

  - interval: 1m
    input_series:
      - series: 'megacampus_qdrant_last_successful_snapshot_unixtime_seconds'
        values: '0x700'
      - series: 'megacampus_qdrant_last_successful_restore_drill_unixtime_seconds'
        values: '0x52000'
      - series: 'megacampus_qdrant_offhost_last_successful_snapshot_unixtime_seconds'
        values: '0x52000'
      - series: 'megacampus_qdrant_offhost_last_successful_restore_drill_unixtime_seconds'
        values: '0x52000'
    alert_rule_test:
      - eval_time: 9h
        alertname: QdrantSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Qdrant snapshot is stale or missing
              description: >-
                No successful verified source-local Qdrant snapshot has been recorded within eight
                hours. Off-host freshness is monitored by QdrantOffHostSnapshotStale.
      - eval_time: 36d
        alertname: QdrantRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Qdrant restore drill is stale or missing
              description: No successful isolated restore drill has been recorded within 35 days.
      - eval_time: 37h
        alertname: QdrantOffHostSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Off-host Qdrant snapshot is stale or missing
              description: No checksum-verified Qdrant copy has reached the second host within 36 hours.
      - eval_time: 36d
        alertname: QdrantOffHostRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Off-host Qdrant restore drill is stale or missing
              description: No exact-version restore from the second-host copy has succeeded within 35 days.

  - interval: 1m
    alert_rule_test:
      - eval_time: 3m
        alertname: QdrantDown
        exp_alerts:
          - exp_labels:
              job: qdrant
              severity: critical
            exp_annotations:
              summary: Qdrant metrics target is unavailable
              description: The authenticated Qdrant main-listener scrape has failed for two minutes.
      - eval_time: 1m
        alertname: QdrantSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Qdrant snapshot is stale or missing
              description: >-
                No successful verified source-local Qdrant snapshot has been recorded within eight
                hours. Off-host freshness is monitored by QdrantOffHostSnapshotStale.
      - eval_time: 1m
        alertname: QdrantRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Qdrant restore drill is stale or missing
              description: No successful isolated restore drill has been recorded within 35 days.
      - eval_time: 1m
        alertname: QdrantOffHostSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Off-host Qdrant snapshot is stale or missing
              description: No checksum-verified Qdrant copy has reached the second host within 36 hours.
      - eval_time: 1m
        alertname: QdrantOffHostRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Off-host Qdrant restore drill is stale or missing
              description: No exact-version restore from the second-host copy has succeeded within 35 days.

  # evidence-counter-reset
  - interval: 1m
    input_series:
      - series: 'megacampus_document_evidence_runs_total{stage="stage4",status="failed"}'
        values: '0+0x2 0+1x3'
      - series: 'megacampus_document_evidence_coverage_ratio'
        values: '0.75x10'
      - series: 'megacampus_document_evidence_degraded_automatic_decisions_total'
        values: '8 9 0 1 2 3 3 3 3 3'
      - series: 'megacampus_document_evidence_unresolved_critical_conflicts'
        values: '1x130'
      - series: 'megacampus_document_evidence_oldest_unresolved_critical_unixtime_seconds'
        values: '1x130'
    alert_rule_test:
      - eval_time: 5m
        alertname: DocumentEvidenceRunFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A document evidence run or invocation failed
              description: At least one durable Stage 4 evidence run or best-effort Stage 4 invocation failed in the last ten minutes.
      - eval_time: 6m
        alertname: DocumentEvidenceCoverageIncomplete
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Document evidence coverage is incomplete
              description: The latest Stage 4 evidence ledger is below exact full coverage or its coverage signal is missing.
      - eval_time: 6m
        alertname: DocumentEvidenceDegradedAutomaticDecisionsRepeated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Degraded automatic evidence decisions are repeating
              description: At least three degraded automatic decisions occurred within thirty minutes.
      - eval_time: 2h
        alertname: DocumentEvidenceCriticalConflictStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A critical document conflict remains unresolved
              description: A critical document conflict has remained unresolved for more than one hour or its age signal is missing.

  # evidence-invocation-only-failure
  - interval: 1m
    input_series:
      - series: 'megacampus_document_evidence_stage4_invocations_total{service="worker",instance="worker-1",status="failed",mode="active"}'
        values: '0+0x2 0+1x3'
    alert_rule_test:
      - eval_time: 5m
        alertname: DocumentEvidenceRunFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A document evidence run or invocation failed
              description: At least one durable Stage 4 evidence run or best-effort Stage 4 invocation failed in the last ten minutes.

  # evidence-series-absent
  - interval: 1m
    input_series:
      - series: 'megacampus_document_evidence_runs_total{stage="stage4",status="accepted"}'
        values: '1x10'
      - series: 'megacampus_document_evidence_unresolved_critical_conflicts'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DocumentEvidenceCoverageIncomplete
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Document evidence coverage is incomplete
              description: The latest Stage 4 evidence ledger is below exact full coverage or its coverage signal is missing.
      - eval_time: 6m
        alertname: DocumentEvidenceCriticalConflictStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A critical document conflict remains unresolved
              description: A critical document conflict has remained unresolved for more than one hour or its age signal is missing.

  # supabase-backup-stale: the metric is a timestamp, so a run that never happened leaves it
  # behind wall-clock time. Matches the QdrantSnapshotStale pattern above: hold the stamp at 0 and
  # evaluate past the threshold.
  - interval: 1m
    input_series:
      - series: 'megacampus_supabase_last_successful_backup_unixtime_seconds'
        values: '0x1900'
    alert_rule_test:
      - eval_time: 31h
        alertname: SupabaseBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Supabase backup is stale
              description: No successful verified Supabase backup has been recorded within thirty hours. The metric is stamped only after pg_restore validation and pointer publication succeed.
      # A backup inside the window must NOT fire, or the alert is just noise on a timer.
      - eval_time: 29h
        alertname: SupabaseBackupStale
        exp_alerts: []
      # A present-but-stale metric is not a missing one. Keeping these apart is the whole
      # point of the mc2-adb6y split.
      - eval_time: 31h
        alertname: SupabaseBackupMetricMissing
        exp_alerts: []

  # supabase-backup-absent: never published is as bad as stale, but it is a DIFFERENT
  # problem and now has its own alert. On 2026-08-20 the old combined rule fired
  # "backup is stale" because a full host disk stopped Prometheus writing its WAL; the
  # backup had run perfectly. One means go look at the backup, the other means the
  # monitoring cannot see.
  - interval: 1m
    input_series:
      - series: 'up{job="qdrant",environment="staging"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SupabaseBackupMetricMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Supabase backup metric is not being reported
              description: 'The backup metric has been absent for ten minutes, so backup health is UNKNOWN rather than known-bad. Check the host before the backup: a full disk stops Prometheus writing its WAL and silences this series, and the textfile writer cannot publish either. See HostDiskCritical.'
      # Absent must not masquerade as stale any more.
      - eval_time: 15m
        alertname: SupabaseBackupStale
        exp_alerts: []

  # host-capacity: the alert that did not exist on 2026-08-20, when the host reached 100%
  # and the only thing that fired blamed the backup (mc2-adb6y). 148 GB total, held first
  # at 20% free (quiet), then 10% (warning), then 3% (critical).
  - interval: 1m
    input_series:
      - series: 'megacampus_host_filesystem_size_bytes{mountpoint="/"}'
        values: '148000000000x60'
      - series: 'megacampus_host_filesystem_avail_bytes{mountpoint="/"}'
        values: '29600000000x20 14800000000x20 4440000000x20'
    alert_rule_test:
      # 20% free: healthy, nothing fires.
      - eval_time: 10m
        alertname: HostDiskLow
        exp_alerts: []
      # 10% free, held past the 15m window.
      - eval_time: 38m
        alertname: HostDiskLow
        exp_alerts:
          - exp_labels:
              severity: warning
              mountpoint: /
            exp_annotations:
              summary: Host filesystem below 15% free
              description: '/ has less than 15% free. Docker images and build cache are the usual cause; `docker builder prune -af` frees the most for the least risk.'
      # 10% free must NOT read as critical; a warning that cries critical gets muted.
      - eval_time: 38m
        alertname: HostDiskCritical
        exp_alerts: []
      # 3% free, held past the 5m window.
      - eval_time: 50m
        alertname: HostDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              mountpoint: /
            exp_annotations:
              summary: Host filesystem below 5% free
              description: / has less than 5% free. Deploys will fail with ENOSPC and Prometheus will stop recording, which silences other alerts and makes them look resolved. Free space before trusting any other signal from this host.

  # host-capacity-absent: no disk metric means no disk headroom knowledge, which is how
  # this went unnoticed for as long as it did.
  - interval: 1m
    input_series:
      - series: 'up{job="qdrant",environment="staging"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: HostDiskMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Host filesystem metric is not being reported
              description: megacampus-host-disk-metrics.timer has published nothing for thirty minutes, so disk headroom is unknown. Check the timer and the textfile directory.
