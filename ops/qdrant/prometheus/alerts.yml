groups:
  - name: qdrant-recording
    interval: 30s
    rules:
      - record: megacampus:qdrant_rest_error_ratio:10m
        expr: |
          sum(rate(qdrant_rest_responses_total{status=~"4..|5.."}[10m]))
          /
          clamp_min(sum(rate(qdrant_rest_responses_total[10m])), 1e-12)
      - record: megacampus:qdrant_rest_latency_p95_seconds:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, collection) (
              rate(qdrant_rest_responses_duration_seconds_bucket[5m])
            )
          )

  - name: qdrant-alerts
    rules:
      - alert: QdrantDown
        expr: (up{job="qdrant"} == 0) or absent(up{job="qdrant"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Qdrant metrics target is unavailable
          description: The authenticated Qdrant main-listener scrape has failed for two minutes.

      - alert: QdrantRecoveryMode
        expr: qdrant_app_status_recovery_mode == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Qdrant remains in recovery mode
          description: Qdrant has reported recovery mode for five minutes.

      - alert: QdrantRestErrorRateHigh
        expr: megacampus:qdrant_rest_error_ratio:10m > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Qdrant REST error ratio is high
          description: Qdrant 4xx/5xx responses exceed two percent of REST responses.

      - alert: QdrantMemoryHigh
        expr: qdrant_memory_resident_bytes / 2147483648 > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Qdrant resident memory is high
          description: Resident memory exceeds 85 percent of the fixed two GiB Compose limit.

      - alert: QdrantPointCountUnexpectedDrop
        expr: |
          qdrant_collection_points < 0.9 * (qdrant_collection_points offset 5m)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Qdrant collection point count dropped unexpectedly
          description: A physical collection lost more than ten percent of its points between scrapes.

      - alert: QdrantSnapshotStale
        expr: |
          (time() - megacampus_qdrant_last_successful_snapshot_unixtime_seconds > 8 * 60 * 60)
          or absent(megacampus_qdrant_last_successful_snapshot_unixtime_seconds)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Qdrant snapshot is stale or missing
          description: >-
            No successful verified source-local Qdrant snapshot has been recorded within eight
            hours. Off-host freshness is monitored by QdrantOffHostSnapshotStale.

      - alert: QdrantRestoreDrillStale
        expr: |
          (time() - megacampus_qdrant_last_successful_restore_drill_unixtime_seconds > 35 * 24 * 60 * 60)
          or absent(megacampus_qdrant_last_successful_restore_drill_unixtime_seconds)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Qdrant restore drill is stale or missing
          description: No successful isolated restore drill has been recorded within 35 days.

      - alert: QdrantRestoreDrillFailed
        expr: increase(megacampus_qdrant_restore_drill_failures_total[6h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Qdrant restore drill failed
          description: >-
            The isolated restore drill recorded a failure. Read the newest file under
            /var/lib/megacampus-qdrant-recovery/restore-evidence/ on the deploy host. An identity
            mismatch whose field list omits content means the recovery probe is stale, not the
            backup; regenerate it with deploy/qdrant/generate-recovery-probe.py and rerun the drill.

      - alert: QdrantOffHostSnapshotStale
        expr: |
          (time() - megacampus_qdrant_offhost_last_successful_snapshot_unixtime_seconds > 36 * 60 * 60)
          or absent(megacampus_qdrant_offhost_last_successful_snapshot_unixtime_seconds)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Off-host Qdrant snapshot is stale or missing
          description: No checksum-verified Qdrant copy has reached the second host within 36 hours.

      - alert: QdrantOffHostRestoreDrillStale
        expr: |
          (time() - megacampus_qdrant_offhost_last_successful_restore_drill_unixtime_seconds > 35 * 24 * 60 * 60)
          or absent(megacampus_qdrant_offhost_last_successful_restore_drill_unixtime_seconds)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Off-host Qdrant restore drill is stale or missing
          description: No exact-version restore from the second-host copy has succeeded within 35 days.

      - alert: QdrantHybridFallbackHigh
        expr: |
          sum(rate(megacampus_qdrant_hybrid_fallback_total[15m]))
          /
          clamp_min(sum(rate(megacampus_qdrant_hybrid_requests_total[15m])), 1e-12)
          > 0.05
          and sum(rate(megacampus_qdrant_hybrid_requests_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Qdrant hybrid fallback ratio is high
          description: Dense-only fallbacks exceed five percent of hybrid requests.

  - name: document-evidence-alerts
    rules:
      # mc2-kim48. Every expression in this group aggregates `by (environment)` rather
      # than bare. Bare `sum()` drops ALL labels, so an alert could not carry the
      # environment it came from even in principle — and because the label was then
      # absent, `external_labels: environment: staging` filled it in, which is applied
      # "only when a time series does not have a given label yet". A dev failure would
      # therefore have paged the staging on-call as staging, and a dev count would have
      # been added to a staging count inside the same `sum`. Aggregating by environment
      # fixes both: the environments are counted apart and the notification says which.
      # Series with no environment label still read as staging, by the same external
      # label, so nothing that works today changes.
      - alert: DocumentEvidenceRunFailed
        expr: |
          sum by (environment) (increase(megacampus_document_evidence_runs_total{stage="stage4",status="failed"}[10m])) > 0
          or
          sum by (environment) (increase(megacampus_document_evidence_stage4_invocations_total{status="failed"}[10m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 'A document evidence run or invocation failed ({{ or $labels.environment "unlabelled" }})'
          description: At least one durable Stage 4 evidence run or best-effort Stage 4 invocation failed in the last ten minutes, in {{ or $labels.environment "unlabelled" }}.

      # The second branch was `and absent(coverage_ratio)`, which asks whether the metric
      # is missing EVERYWHERE. With two environments reporting, one of them losing its
      # coverage signal would leave `absent()` empty and the branch silent. `unless
      # count by (environment)` asks the same question per environment: runs reported
      # here, no coverage reported here. The condition `sum(runs_total) > 0` is kept and
      # still does its job — "nothing ran" is not a coverage failure (mc2-kim48).
      - alert: DocumentEvidenceCoverageIncomplete
        expr: |
          min by (environment) (megacampus_document_evidence_coverage_ratio) < 1
          or (
            sum by (environment) (megacampus_document_evidence_runs_total{stage="stage4"}) > 0
            unless
            count by (environment) (megacampus_document_evidence_coverage_ratio)
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Document evidence coverage is incomplete ({{ or $labels.environment "unlabelled" }})'
          description: The latest Stage 4 evidence ledger in {{ or $labels.environment "unlabelled" }} is below exact full coverage or its coverage signal is missing.

      - alert: DocumentEvidenceDegradedAutomaticDecisionsRepeated
        expr: sum by (environment) (increase(megacampus_document_evidence_degraded_automatic_decisions_total[30m])) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'Degraded automatic evidence decisions are repeating ({{ or $labels.environment "unlabelled" }})'
          description: At least three degraded automatic decisions occurred within thirty minutes, in {{ or $labels.environment "unlabelled" }}.

      # Same treatment for the missing-age branch: `absent()` returns a label-less series,
      # so it can neither be matched against a per-environment left side nor say which
      # environment lost its age signal. `unless count by (environment)` does both.
      - alert: DocumentEvidenceCriticalConflictStale
        expr: |
          max by (environment) (megacampus_document_evidence_unresolved_critical_conflicts) > 0
          and (
            time() - min by (environment) (megacampus_document_evidence_oldest_unresolved_critical_unixtime_seconds > 0) > 60 * 60
            or (
              max by (environment) (megacampus_document_evidence_unresolved_critical_conflicts) > 0
              unless
              count by (environment) (megacampus_document_evidence_oldest_unresolved_critical_unixtime_seconds > 0)
            )
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'A critical document conflict remains unresolved ({{ or $labels.environment "unlabelled" }})'
          description: A critical document conflict in {{ or $labels.environment "unlabelled" }} has remained unresolved for more than one hour, or its age signal is missing.

  - name: supabase-backup-alerts
    rules:
      # mc2-1cxna. megacampus-supabase-backup.timer is ENABLED and its 00:30 run on 2026-07-31
      # failed; the only trace was a log line nobody reads, so a one-night hole opened in the
      # backup chain and nothing raised it. The scheduler now stamps this metric only after the
      # published pointer validates, so a failed, skipped or never-started run simply lets it go
      # stale. The schedule is daily, and the threshold leaves six hours of slack before a single
      # missed run is called out.
      # mc2-adb6y split this rule in two. It used to carry `or absent(metric)`, and on
      # 2026-08-20 that branch fired critical while the backup was perfectly healthy: the
      # host disk was full, Prometheus could not write its own WAL ("write to WAL: log
      # samples: ... no space left on device"), the series stopped receiving samples, and
      # `absent()` reported that as a backup failure. The two conditions need opposite
      # responses — one means "go look at the backup", the other means "the monitoring
      # cannot see", usually because of the host itself — so they are now separate alerts
      # with separate text.
      - alert: SupabaseBackupStale
        expr: |
          time() - megacampus_supabase_last_successful_backup_unixtime_seconds > 30 * 60 * 60
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Supabase backup is stale
          description: >-
            No successful verified Supabase backup has been recorded within thirty hours. The
            metric is stamped only after pg_restore validation and pointer publication succeed.

      - alert: SupabaseBackupMetricMissing
        expr: absent(megacampus_supabase_last_successful_backup_unixtime_seconds)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Supabase backup metric is not being reported
          description: >-
            The backup metric has been absent for ten minutes, so backup health is UNKNOWN
            rather than known-bad. Check the host before the backup: a full disk stops
            Prometheus writing its WAL and silences this series, and the textfile writer
            cannot publish either. See HostDiskCritical.

  - name: host-capacity-alerts
    rules:
      # mc2-adb6y. The deploy host reached 100% (148G, 141G used, 0 available) with no
      # alert of any kind — seventeen rules and not one about disk. The first symptom was
      # a deploy dying on `ENOSPC: mkdir '/tmp/tsx-1001'`, and the only alert that arrived
      # blamed the Supabase backup, which was fine.
      #
      # Fed by ops/qdrant/textfile/publish-disk-metrics.sh through the textfile collector,
      # because the exporter is deliberately scoped to "no host collectors or host
      # namespaces" and mounting `/` into it to read the host filesystem would undo that.
      - alert: HostDiskLow
        expr: |
          megacampus_host_filesystem_avail_bytes
          / clamp_min(megacampus_host_filesystem_size_bytes, 1) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host filesystem below 15% free
          description: >-
            {{ $labels.mountpoint }} has less than 15% free. Docker images and build cache are
            the usual cause; `docker builder prune -af` frees the most for the least risk.

      - alert: HostDiskCritical
        expr: |
          megacampus_host_filesystem_avail_bytes
          / clamp_min(megacampus_host_filesystem_size_bytes, 1) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Host filesystem below 5% free
          description: >-
            {{ $labels.mountpoint }} has less than 5% free. Deploys will fail with ENOSPC and
            Prometheus will stop recording, which silences other alerts and makes them look
            resolved. Free space before trusting any other signal from this host.

      - alert: HostDiskMetricMissing
        expr: absent(megacampus_host_filesystem_avail_bytes)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Host filesystem metric is not being reported
          description: >-
            megacampus-host-disk-metrics.timer has published nothing for thirty minutes, so
            disk headroom is unknown. Check the timer and the textfile directory.
