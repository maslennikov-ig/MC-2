global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging

# mc2-jz6y0.25. Prometheus 3.13.1 marks --storage.tsdb.retention.time and .size DEPRECATED and
# names these fields as the replacement; verified against `prometheus --help` from the pinned image.
# Raised from the 15d/5GB the flags carried: the host has 87GB free, and 30 days is the window an
# incident review actually needs. Whichever limit is reached first wins.
storage:
  tsdb:
    retention:
      time: 30d
      size: 20GB

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: qdrant
    metrics_path: /metrics
    params:
      per_collection:
        - 'true'
    static_configs:
      - targets:
          - 'qdrant:6333'
        labels:
          environment: staging
    http_headers:
      api-key:
        files:
          - /run/secrets/qdrant_read_only_api_key

  - job_name: qdrant_textfiles
    static_configs:
      - targets:
          - 'node_exporter:9100'
        labels:
          environment: staging
    # mc2-kim48. One node_exporter serves one host directory, and dev and staging
    # containers write into it side by side. The files never collide — each writer owns
    # `evidence-<service>-<instance>.prom` and the Stage 4 aggregate is reconciled from
    # the shared database rather than accumulated — but the TARGET label above would
    # stamp every one of them `staging`, so a dev failure would page as staging.
    #
    # The writer's own `instance` label survives the scrape as `exported_instance`
    # (verified against the live Prometheus, 2026-08-28: `service="worker"`,
    # `exported_instance="worker"`, `instance="node_exporter:9100"`), and dev writers
    # end theirs in `-dev`. Rewriting `environment` from it is enough to tell them
    # apart, and it costs neither a second exporter nor a second scrape target.
    #
    # `metric_relabel_configs` runs last, after target labels and after the
    # `exported_` renaming, which is why the source label exists at this point.
    metric_relabel_configs:
      - source_labels: [exported_instance]
        regex: '.*-dev'
        target_label: environment
        replacement: dev

  - job_name: alertmanager
    static_configs:
      - targets:
          - 'alertmanager:9093'
        labels:
          environment: staging
