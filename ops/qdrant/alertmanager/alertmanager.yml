global:
  resolve_timeout: 5m

route:
  receiver: qdrant-telegram
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: qdrant-telegram
    telegram_configs:
      - bot_token_file: /run/secrets/alertmanager_telegram_bot_token
        chat_id_file: /run/secrets/alertmanager_telegram_chat_id
        send_resolved: true
