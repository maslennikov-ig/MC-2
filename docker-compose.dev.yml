# MegaCampus Development Environment Docker Compose
# Simple deployment for develop branch (no Blue/Green)
# Usage: docker compose -f docker-compose.dev.yml --env-file .env.dev up -d

services:
  # ============================================
  # DEV APPLICATION SERVICES
  # ============================================

  # Next.js Web Application (Dev)
  web-dev:
    image: ghcr.io/maslennikov-ig/mc-2/web:develop
    container_name: megacampus-web-dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:3010:3000'
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=https://dev.ai.megacampus.ru
      - NEXT_PUBLIC_API_URL=http://megacampus-api-dev:4000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # API Server (Dev)
  api-dev:
    image: ghcr.io/maslennikov-ig/mc-2/api:develop
    container_name: megacampus-api-dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:4010:4000'
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://megacampus-redis:6379
      - DOCLING_MCP_URL=http://megacampus-docling-mcp:8000/mcp
    volumes:
      - ./data/uploads-dev:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

networks:
  megacampus:
    external: true
    name: megacampus-network
