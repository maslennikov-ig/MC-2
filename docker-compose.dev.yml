# MegaCampus Development Environment Docker Compose
# Simple deployment for develop branch (no Blue/Green)
# Usage: docker compose -f docker-compose.dev.yml --env-file .env.dev up -d

services:
  # ============================================
  # DEV APPLICATION SERVICES
  # ============================================

  # Qdrant Vector Database (Dev) - local persistent vector store for RAG
  qdrant-dev:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    platform: linux/amd64
    container_name: megacampus-qdrant-dev
    restart: unless-stopped
    entrypoint: ['/opt/megacampus/qdrant-secret-entrypoint.sh']
    ports:
      - '127.0.0.1:6333:6333'
    environment:
      - QDRANT_API_KEY_FILE=/run/secrets/qdrant_api_key
      - QDRANT_READ_ONLY_API_KEY_FILE=/run/secrets/qdrant_read_only_api_key
      - QDRANT_SNAPSHOT_STORAGE=local
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__METRICS_PREFIX=qdrant_
    volumes:
      - qdrant-dev-data:/qdrant/storage
      - ./deploy/qdrant/secret-entrypoint.sh:/opt/megacampus/qdrant-secret-entrypoint.sh:ro
    secrets:
      - qdrant_api_key
      - qdrant_read_only_api_key
    healthcheck:
      test: ['CMD', '/opt/megacampus/qdrant-secret-entrypoint.sh', 'healthcheck']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # NotebookLM Bridge (Dev) - Stage 7 audio/video generation backend
  notebooklm-bridge-dev:
    image: ghcr.io/maslennikov-ig/mc-2/notebooklm-bridge:develop
    container_name: megacampus-notebooklm-bridge-dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:8010:8000'
    env_file:
      - ${DEV_ENV_FILE:-.env.dev}
    environment:
      # NOTEBOOKLM_AUTH_JSON passed via env_file when set (must NOT be empty string)
      - NOTEBOOKLM_STORAGE_PATH=${NOTEBOOKLM_STORAGE_PATH:-/app/secrets/notebooklm/storage_state.json}
      - NOTEBOOKLM_HOME=${NOTEBOOKLM_HOME:-/app/secrets/notebooklm}
      - NOTEBOOKLM_GENERATION_TIMEOUT_SECONDS=${NOTEBOOKLM_GENERATION_TIMEOUT_SECONDS:-10800}
      - NOTEBOOKLM_QUEUE_WAIT_TIMEOUT_SECONDS=${NOTEBOOKLM_QUEUE_WAIT_TIMEOUT_SECONDS:-259200}
      - NOTEBOOKLM_HTTP_TIMEOUT_SECONDS=${NOTEBOOKLM_HTTP_TIMEOUT_SECONDS:-60}
      - NOTEBOOKLM_POLL_ERROR_RETRY_LIMIT=${NOTEBOOKLM_POLL_ERROR_RETRY_LIMIT:-12}
      - NOTEBOOKLM_LOG_LEVEL=${NOTEBOOKLM_LOG_LEVEL:-INFO}
      # Route NotebookLM traffic through bobabuh SOCKS5 proxy (geo-bypass)
      - HTTPS_PROXY=socks5h://172.19.0.1:1080
      - HTTP_PROXY=socks5h://172.19.0.1:1080
    volumes:
      - ${NOTEBOOKLM_STORAGE_STATE_DIR:-./secrets/notebooklm}:/app/secrets/notebooklm:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import socket; s=socket.socket(); s.connect((''localhost'', 8000)); s.close()" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # Next.js Web Application (Dev)
  web-dev:
    image: ghcr.io/maslennikov-ig/mc-2/web:develop
    container_name: megacampus-web-dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:3010:3000'
    env_file:
      - ${DEV_ENV_FILE:-.env.dev}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=https://dev.ai.megacampus.ru
      - NEXT_PUBLIC_API_URL=http://megacampus-api-dev:4000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - megacampus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # API Server (Dev)
  api-dev:
    image: ghcr.io/maslennikov-ig/mc-2/api:develop
    container_name: megacampus-api-dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:4010:4000'
    env_file:
      - ${DEV_ENV_FILE:-.env.dev}
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://megacampus-redis:6379
      - QDRANT_URL=http://qdrant-dev:6333
      - DOCLING_MCP_URL=http://megacampus-docling-mcp:8000/mcp
      - DOCLING_MCP_TIMEOUT=1200000
      - DOCLING_MCP_MAX_RETRIES=1
      - NOTEBOOKLM_BRIDGE_URL=http://notebooklm-bridge-dev:8000
      - NOTEBOOKLM_BRIDGE_TIMEOUT_MS=${NOTEBOOKLM_BRIDGE_TIMEOUT_MS:-3600000}
      # Fix file path for document processing (override .env from image)
      - DOCLING_UPLOADS_BASE_PATH=/app
      - DOCLING_CONTAINER_UPLOADS_PATH=/app/uploads-dev
      # DEV queue isolation - prevents DEV jobs from being picked up by production workers
      - BULLMQ_QUEUE_NAME=course-generation-dev
      - BULLMQ_STAGE6_QUEUE_NAME=stage6-lesson-content-dev
      - BULLMQ_STAGE7_QUEUE_NAME=stage7-enrichments-dev
      # Local storage for enrichment playback URLs (must match worker-stage7-dev)
      - USE_LOCAL_STORAGE=true
      - ENRICHMENTS_PUBLIC_URL=/storage/enrichments
      - ENRICHMENTS_PUBLIC_BASE_URL=https://dev.ai.megacampus.ru
    volumes:
      - ./data/uploads-dev:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)}).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - megacampus
    depends_on:
      qdrant-dev:
        condition: service_healthy
      notebooklm-bridge-dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # BullMQ Worker (Dev) - processes course generation jobs
  worker-dev:
    image: ghcr.io/maslennikov-ig/mc-2/api:develop
    container_name: megacampus-worker-dev
    restart: unless-stopped
    command: ['tsx', 'dist/orchestrator/worker-entrypoint.js']
    healthcheck:
      disable: true
    env_file:
      - ${DEV_ENV_FILE:-.env.dev}
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://megacampus-redis:6379
      - QDRANT_URL=http://qdrant-dev:6333
      # Document evidence is owner-approved for every eligible local/dev course.
      - DOCUMENT_EVIDENCE_ENABLED=true
      - DOCUMENT_EVIDENCE_MODE=active
      - DOCUMENT_EVIDENCE_STAGE5_COHORT_PERCENT=100
      - DOCLING_MCP_URL=http://megacampus-docling-mcp:8000/mcp
      - DOCLING_MCP_TIMEOUT=1200000
      - DOCLING_MCP_MAX_RETRIES=1
      - DOCLING_CACHE_PATH=/app/docling-json-cache
      - LKG_CONFIG_PATH=/app/data/lkg-config.json
      # Fix file path for document processing (override .env from image)
      - DOCLING_UPLOADS_BASE_PATH=/app
      - DOCLING_CONTAINER_UPLOADS_PATH=/app/uploads-dev
      # DEV queue isolation - listens to DEV-only queue
      - BULLMQ_QUEUE_NAME=course-generation-dev
      # Stage 6 queue name - needed for auto-approval to queue Stage 6 jobs correctly
      - BULLMQ_STAGE6_QUEUE_NAME=stage6-lesson-content-dev
      # Stage 7 queue name - needed for triggerCourseCard() after Stage 5
      - BULLMQ_STAGE7_QUEUE_NAME=stage7-enrichments-dev
      - ENRICHMENTS_STORAGE_BUCKET=course-enrichments
    volumes:
      - ./data/uploads-dev:/app/uploads
      - docling-json-cache:/app/docling-json-cache
      - worker-dev-data:/app/data
    networks:
      - megacampus
    depends_on:
      qdrant-dev:
        condition: service_healthy
      api-dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # Stage 6 Lesson Content Worker (Dev) - generates lesson content with 30 concurrent LLM operations
  worker-stage6-dev:
    image: ghcr.io/maslennikov-ig/mc-2/api:develop
    container_name: megacampus-worker-stage6-dev
    restart: unless-stopped
    command: ['tsx', 'dist/orchestrator/worker-entrypoint.js']
    healthcheck:
      disable: true
    env_file:
      - ${DEV_ENV_FILE:-.env.dev}
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://megacampus-redis:6379
      - QDRANT_URL=http://qdrant-dev:6333
      # Document evidence is owner-approved for every eligible local/dev course.
      - DOCUMENT_EVIDENCE_ENABLED=true
      - DOCUMENT_EVIDENCE_MODE=active
      - DOCUMENT_EVIDENCE_STAGE5_COHORT_PERCENT=100
      # Enable dedicated Stage 6 worker mode (30 concurrent)
      - STAGE6_WORKER=true
      # DEV queue isolation - listens to DEV-only stage6 queue
      - BULLMQ_STAGE6_QUEUE_NAME=stage6-lesson-content-dev
      - DOCLING_CACHE_PATH=/app/docling-json-cache
      - LKG_CONFIG_PATH=/app/data/lkg-config.json
      # Fix file path for document processing (override .env from image)
      - DOCLING_UPLOADS_BASE_PATH=/app
      - DOCLING_CONTAINER_UPLOADS_PATH=/app/uploads-dev
    volumes:
      - ./data/uploads-dev:/app/uploads
      - docling-json-cache:/app/docling-json-cache
      - worker-dev-data:/app/data
    networks:
      - megacampus
    depends_on:
      qdrant-dev:
        condition: service_healthy
      api-dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # Stage 7 Enrichment Worker (Dev) - cover images, audio, video, quiz, presentation
  worker-stage7-dev:
    image: ghcr.io/maslennikov-ig/mc-2/api:develop
    container_name: megacampus-worker-stage7-dev
    restart: unless-stopped
    command: ['tsx', 'dist/stages/stage7-enrichments/worker-entrypoint.js']
    healthcheck:
      disable: true
    env_file:
      - ${DEV_ENV_FILE:-.env.dev}
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://megacampus-redis:6379
      # DEV queue isolation - listens to DEV-only stage7 queue
      - BULLMQ_STAGE7_QUEUE_NAME=stage7-enrichments-dev
      # Use local storage instead of Supabase (auto-switch in unified-storage-service)
      - USE_LOCAL_STORAGE=true
      # Local storage for enrichment assets
      - ENRICHMENTS_LOCAL_PATH=/app/data/enrichments
      - ENRICHMENTS_PUBLIC_URL=/storage/enrichments
      - NOTEBOOKLM_BRIDGE_URL=http://notebooklm-bridge-dev:8000
      - NOTEBOOKLM_BRIDGE_TIMEOUT_MS=${NOTEBOOKLM_BRIDGE_TIMEOUT_MS:-3600000}
      # Fix file path for document processing (override .env from image)
      - DOCLING_UPLOADS_BASE_PATH=/app
      - DOCLING_CONTAINER_UPLOADS_PATH=/app/uploads-dev
    volumes:
      - ./data/uploads-dev:/app/uploads
      # Local enrichment storage (covers, cards) - served by nginx
      - ./data/enrichments:/app/data/enrichments
    networks:
      - megacampus
    depends_on:
      api-dev:
        condition: service_healthy
      notebooklm-bridge-dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

volumes:
  qdrant-dev-data:
    name: megacampus_qdrant-dev
  docling-json-cache:
    external: true
    name: megacampus_docling-json-cache
  worker-dev-data:
    name: megacampus_worker-dev-data

networks:
  megacampus:
    external: true
    name: megacampus-network

secrets:
  qdrant_api_key:
    file: ${QDRANT_API_KEY_FILE:-./secrets/qdrant_api_key}
  qdrant_read_only_api_key:
    file: ${QDRANT_READ_ONLY_API_KEY_FILE:-./secrets/qdrant_read_only_api_key}
